<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Club Display</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Rajdhani:wght@400;500;600;700&display=swap">

<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --void:    #05050E;
    --surface: #0D0D1F;
    --violet:  #8B2EFF;
    --cyan:    #00E5FF;
    --magenta: #FF1A8C;
    --white:   #EEEEFF;
    --dim:     #2A2A4A;
    --muted:   #55558A;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
  }

  body {
    background: var(--void);
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    cursor: default;
    user-select: none;
  }

  /* ─── VIDEO BACKGROUND ─── */
  #bgVideo {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
  }

  /* ─── VIDEO DARK OVERLAY ─── */
  .video-darken {
    position: fixed;
    inset: 0;
    background: rgba(5, 5, 14, 0.50);
    z-index: 0;
    pointer-events: none;
  }

  /* ─── CANVAS — light beams overlay video ─── */
  canvas#bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    mix-blend-mode: screen;
    pointer-events: none;
  }

  /* ─── VIGNETTE ─── */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 35%, rgba(5,5,14,0.75) 100%);
  }

  /* ─── SCANLINES ─── */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.06) 2px,
      rgba(0,0,0,0.06) 4px
    );
  }

  /* ─── MAIN DISPLAY ─── */
  .display {
    position: relative;
    z-index: 4;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    padding: 3rem;
    text-align: center;
    gap: 0;
  }

  .eyebrow {
    font-weight: 500;
    font-size: clamp(0.6rem, 1.2vw, 1rem);
    letter-spacing: 0.55em;
    text-transform: uppercase;
    color: var(--white);
    margin-bottom: clamp(1rem, 2.5vh, 2rem);
  }

  .show-name {
    font-family: 'Big Shoulders Display', sans-serif;
    font-weight: 900;
    font-size: clamp(56px, 17vw, 280px);
    line-height: 0.86;
    text-transform: uppercase;
    color: var(--white);
    text-wrap: balance;
    letter-spacing: -0.01em;
    animation: glowCycle 9s ease-in-out infinite;
  }

  @keyframes glowCycle {
    0%, 100% {
      color: #FF1A8C;
      text-shadow:
        0 0 20px rgba(255,26,140,1),
        0 0 60px rgba(255,26,140,0.7),
        0 0 120px rgba(255,26,140,0.3);
    }
    50% {
      color: #ffffff;
      text-shadow:
        0 0 20px rgba(255,255,255,1),
        0 0 60px rgba(255,255,255,0.7),
        0 0 120px rgba(255,255,255,0.3);
    }
  }

  .divider {
    width: clamp(60px, 12vw, 180px);
    height: 1px;
    margin: clamp(1.2rem, 3vh, 2.2rem) 0 clamp(1rem, 2.5vh, 1.8rem);
    background: var(--violet);
    animation: dividerHue 9s linear infinite;
  }

  @keyframes dividerHue {
    from { filter: hue-rotate(0deg); box-shadow: 0 0 10px rgba(139,46,255,0.6); }
    to   { filter: hue-rotate(360deg); box-shadow: 0 0 10px rgba(139,46,255,0.6); }
  }

  .with-label {
    font-weight: 500;
    font-size: clamp(0.55rem, 1vw, 0.85rem);
    letter-spacing: 0.5em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: clamp(0.3rem, 1vh, 0.6rem);
  }

  .dj-name {
    font-weight: 700;
    font-size: clamp(22px, 5vw, 82px);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(238, 238, 255, 0.88);
  }

  /* ─── LIVE BADGE ─── */
  .live-wrap {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: clamp(1.5rem, 4vh, 3rem);
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--magenta);
    box-shadow: 0 0 8px var(--magenta), 0 0 18px rgba(255,26,140,0.5);
    animation: blink 1.6s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.25; }
  }

  .live-text {
    font-weight: 700;
    font-size: 0.7rem;
    letter-spacing: 0.45em;
    text-transform: uppercase;
    color: var(--magenta);
  }

  /* ─── CLOCK ─── */
  .clock {
    position: fixed;
    top: 1.5rem;
    right: 2rem;
    z-index: 5;
    font-weight: 400;
    font-size: clamp(0.9rem, 1.8vw, 1.4rem);
    letter-spacing: 0.18em;
    color: #ffffff;
    font-variant-numeric: tabular-nums;
  }

  /* ─── FULLSCREEN HINT ─── */
  .hint {
    position: fixed;
    bottom: 1.6rem;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    font-weight: 400;
    font-size: 0.65rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--dim);
    pointer-events: none;
    white-space: nowrap;
  }

  /* ─── ADMIN TOGGLE ─── */
  .admin-toggle {
    position: fixed;
    bottom: 1.4rem;
    right: 1.4rem;
    z-index: 20;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--dim);
    background: rgba(13,13,31,0.85);
    color: var(--white);
    cursor: pointer;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(10px);
    transition: border-color 0.2s, color 0.2s;
    outline: none;
  }

  .admin-toggle:hover,
  .admin-toggle:focus-visible {
    border-color: var(--magenta);
    color: var(--white);
  }

  /* ─── ADMIN PANEL ─── */
  .admin-panel {
    position: fixed;
    top: 0;
    right: 0;
    z-index: 19;
    width: min(300px, 88vw);
    height: 100vh;
    background: rgba(8,8,22,0.96);
    border-left: 1px solid var(--dim);
    backdrop-filter: blur(24px);
    padding: 2rem 1.4rem 2rem;
    display: flex;
    flex-direction: column;
    gap: 1.4rem;
    transform: translateX(100%);
    transition: transform 0.32s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .admin-panel.open {
    transform: translateX(0);
  }

  .admin-heading {
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--white);
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--dim);
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .field-label {
    font-weight: 600;
    font-size: 0.7rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--white);
  }

  .field-input {
    background: rgba(42,42,74,0.5);
    border: 1px solid var(--dim);
    border-radius: 3px;
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 0.55rem 0.7rem;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    width: 100%;
  }

  .field-input::placeholder {
    color: var(--dim);
  }

  .field-input:focus {
    border-color: var(--magenta);
    background: rgba(255,26,140,0.06);
  }

  .apply-btn {
    margin-top: auto;
    padding: 0.7rem 1rem;
    background: var(--magenta);
    color: var(--white);
    border: none;
    border-radius: 3px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    outline: none;
  }

  .apply-btn:hover,
  .apply-btn:focus-visible {
    background: #FF50AA;
  }


  /* ─── LOGO (mode veille) ─── */
  .logo-wrap {
    display: none;
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    align-items: center;
    justify-content: center;
    background: #000;
    z-index: 10;
  }

  .logo-wrap.visible {
    display: flex;
  }

  .logo-img {
    width: 100vw;
    height: 100vh;
    object-fit: contain;
    filter: drop-shadow(0 0 20px rgba(255,30,140,0.7)) drop-shadow(0 0 60px rgba(255,30,140,0.35));
    animation: logoBreath 5s ease-in-out infinite;
  }

  @keyframes logoBreath {
    0%, 100% {
      transform: scale(1);
      filter: drop-shadow(0 0 18px rgba(255,30,140,0.7)) drop-shadow(0 0 55px rgba(255,30,140,0.3));
    }
    50% {
      transform: scale(1.08);
      filter: drop-shadow(0 0 32px rgba(255,30,140,1)) drop-shadow(0 0 90px rgba(255,30,140,0.55));
    }
  }

  /* ─── MODE TOGGLE IN ADMIN ─── */
  .mode-switch {
    display: flex;
    border: 1px solid var(--dim);
    border-radius: 4px;
    overflow: hidden;
  }

  .mode-btn {
    flex: 1;
    padding: 0.55rem 0.5rem;
    background: transparent;
    border: none;
    color: var(--white);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.18s, color 0.18s;
    outline: none;
  }

  .mode-btn.active {
    background: var(--magenta);
    color: var(--white);
  }

  .mode-btn:not(.active):hover {
    background: rgba(255,26,140,0.12);
    color: var(--white);
  }


  /* ─── ANIMATE.CSS KEYFRAMES ─── */
  @keyframes flip {
    0%   { transform: perspective(600px) rotateY(0deg); }
    100% { transform: perspective(600px) rotateY(360deg); }
  }

  @keyframes flash {
    0%, 50%, 100% { opacity: 1; }
    25%, 75%      { opacity: 0.08; }
  }

  .show-name.anim-flip {
    animation: flip 1.25s ease-in-out 7 both !important;
    backface-visibility: hidden;
  }

  .show-name.anim-flash {
    animation: flash 1.2s ease-in-out infinite !important;
  }


  .launch-btn {
    padding: 0.7rem 1rem;
    background: transparent;
    color: var(--magenta);
    border: 2px solid var(--magenta);
    border-radius: 3px;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
    outline: none;
  }

  .launch-btn:hover,
  .launch-btn:focus-visible {
    background: var(--magenta);
    color: var(--white);
  }

  /* ─── REDUCED MOTION ─── */
  @media (prefers-reduced-motion: reduce) {
    .show-name  { animation: none; text-shadow: 0 0 25px rgba(139,46,255,0.8), 0 0 60px rgba(139,46,255,0.3); }
    .divider    { animation: none; }
    .live-dot   { animation: none; }
  }
</style>
</head>
<body>

<video id="bgVideo" autoplay muted loop playsinline><source src="assets/hero-bg.mp4" type="video/mp4"></video>
<canvas id="bg"></canvas>
<div class="video-darken"></div>
<div class="vignette"></div>
<div class="scanlines"></div>

<div class="logo-wrap" id="logoWrap">
  <img class="logo-img" src="assets/logo.png" alt="Eleven Brussels">
</div>

<main class="display" id="displayArea">
  <p class="eyebrow">Ce soir</p>
  <h1 class="show-name" id="showName">NOM DU SHOW</h1>
</main>

<div class="clock" id="clock"></div>

<button class="admin-toggle" id="adminToggle" title="Paramètres">⚙</button>

<aside class="admin-panel" id="adminPanel" role="dialog" aria-label="Paramètres d'affichage">
  <p class="admin-heading">Configurer l'affichage</p>


  <div class="field">
    <p class="field-label">Mode</p>
    <div class="mode-switch">
      <button class="mode-btn" id="btnShow">Show</button>
      <button class="mode-btn active" id="btnVeille">Veille</button>
    </div>
  </div>

  <div id="sectionShow" style="display:none; flex-direction:column; gap:1.4rem;">
    <div class="field">
      <label class="field-label" for="inputShow">Nom du show</label>
      <input class="field-input" id="inputShow" type="text" placeholder="ex. ELEVEN" autocomplete="off" spellcheck="false">
    </div>
    <button class="launch-btn" id="launchBtn">▶ Lancer le show</button>
  </div>
</aside>

<script>
// ── Canvas ──────────────────────────────────────────────────────────

const canvas = document.getElementById('bg');
const ctx    = canvas.getContext('2d');

function resize() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Light beams — eight cones rotating from a shared center point, all rose/magenta
const NUM_BEAMS = 24;
const beams = Array.from({ length: NUM_BEAMS }, (_, i) => ({
  angle:  (i / NUM_BEAMS) * Math.PI * 2 + i * 0.4,
  hue:    330 + (i % 2) * 15, // rose (~330) et magenta (~345) alternés
  speed:  (0.006 + (i * 0.0005)) * (i % 2 === 0 ? 1 : -1),
  spread: 0.045 + (i % 3) * 0.015,
  alpha:  0.10 + (i % 4) * 0.02,
}));

function drawBeam(b) {
  const cx  = canvas.width  * 0.5;
  const cy  = canvas.height * 0.44;
  const len = Math.hypot(canvas.width, canvas.height) * 0.92;

  const ax = cx + Math.cos(b.angle - b.spread) * len;
  const ay = cy + Math.sin(b.angle - b.spread) * len;
  const bx = cx + Math.cos(b.angle + b.spread) * len;
  const by = cy + Math.sin(b.angle + b.spread) * len;
  const mx = cx + Math.cos(b.angle) * len;
  const my = cy + Math.sin(b.angle) * len;

  const grad = ctx.createLinearGradient(cx, cy, mx, my);
  grad.addColorStop(0,   `hsla(${b.hue},100%,72%,${b.alpha * 1.6})`);
  grad.addColorStop(0.25,`hsla(${b.hue},100%,65%,${b.alpha})`);
  grad.addColorStop(1,   `hsla(${b.hue},100%,58%,0)`);

  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(ax, ay);
  ctx.lineTo(bx, by);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
}

// Particles
function makeP() {
  return {
    x:    Math.random() * window.innerWidth,
    y:    window.innerHeight + Math.random() * 60,
    r:    0.6 + Math.random() * 1.4,
    vy:   0.35 + Math.random() * 0.7,
    vx:   (Math.random() - 0.5) * 0.25,
    hue:  [330, 340, 320][Math.floor(Math.random() * 3)],
    a:    0.45 + Math.random() * 0.45,
    da:   0.0012 + Math.random() * 0.001,
  };
}

const particles = Array.from({ length: 240 }, makeP);

function drawParticle(p) {
  // core dot
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
  ctx.fillStyle = `hsla(${p.hue},100%,82%,${p.a})`;
  ctx.fill();

  // soft halo
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
  g.addColorStop(0, `hsla(${p.hue},100%,72%,${p.a * 0.28})`);
  g.addColorStop(1, `hsla(${p.hue},100%,72%,0)`);
  ctx.beginPath();
  ctx.arc(p.x, p.y, p.r * 5, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
}

function updateParticle(p) {
  p.y -= p.vy;
  p.x += p.vx;
  p.a -= p.da;
  if (p.y < -15 || p.a <= 0) Object.assign(p, makeP());
}

const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (!reducedMotion) {
    beams.forEach(b => {
      b.angle += b.speed;
      drawBeam(b);
    });

    particles.forEach(p => {
      updateParticle(p);
      drawParticle(p);
    });
  }

  requestAnimationFrame(frame);
}
frame();

// ── Clock ───────────────────────────────────────────────────────────

const clockEl = document.getElementById('clock');

function tick() {
  const now = new Date();
  const hh  = String(now.getHours()).padStart(2, '0');
  const mm  = String(now.getMinutes()).padStart(2, '0');
  const ss  = String(now.getSeconds()).padStart(2, '0');
  clockEl.textContent = `${hh}:${mm}:${ss}`;
}
tick();
setInterval(tick, 1000);

// ── Admin panel ─────────────────────────────────────────────────────

const adminToggle = document.getElementById('adminToggle');
const adminPanel  = document.getElementById('adminPanel');
const inputShow   = document.getElementById('inputShow');
const showNameEl  = document.getElementById('showName');

adminToggle.addEventListener('click', e => {
  e.stopPropagation();
  const open = adminPanel.classList.toggle('open');
  if (open) inputShow.focus();
});

[inputShow].forEach(el => {
  el.addEventListener('keydown', e => { if (e.key === 'Enter') launchShow(); });
});

// Close panel on outside click
document.addEventListener('click', e => {
  if (!adminPanel.contains(e.target) && e.target !== adminToggle) {
    adminPanel.classList.remove('open');
  }
});
adminPanel.addEventListener('click', e => e.stopPropagation());

// ── Fullscreen ──────────────────────────────────────────────────────

// Plein écran automatique au chargement
window.addEventListener('load', () => {
  document.documentElement.requestFullscreen().catch(() => {});
});

// Clic sur l'écran = plein écran aussi
document.getElementById('displayArea').addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen().catch(() => {});
  }
});

// ── Mode switching ──────────────────────────────────────────────────

const logoWrap    = document.getElementById('logoWrap');
const displayArea = document.getElementById('displayArea');
const btnShow     = document.getElementById('btnShow');
const btnVeille   = document.getElementById('btnVeille');

const sectionShow = document.getElementById('sectionShow');

function setMode(mode) {
  if (mode === 'veille') {
    showNameEl.classList.remove('anim-flip', 'anim-flash');
    logoWrap.classList.add('visible');
    displayArea.style.display = 'none';
    btnVeille.classList.add('active');
    btnShow.classList.remove('active');
    sectionShow.style.display = 'none';
  } else {
    btnShow.classList.add('active');
    btnVeille.classList.remove('active');
    sectionShow.style.display = 'flex';
  }
}

// Tabs ne ferment pas le panneau
btnShow.addEventListener('click',   () => setMode('show'));
btnVeille.addEventListener('click', () => setMode('veille'));

// Start in veille mode
setMode('veille');


// ── Bouton Lancer ───────────────────────────────────────────────────

const launchBtn = document.getElementById('launchBtn');

function launchShow() {
  // Appliquer le nom saisi
  const show = inputShow.value.trim() || 'NOM DU SHOW';
  showNameEl.textContent = show.toUpperCase();
  // Passer l'écran en show
  logoWrap.classList.remove('visible');
  displayArea.style.display = 'flex';
  adminPanel.classList.remove('open');
  // Lancer animation
  showNameEl.classList.remove('anim-flip', 'anim-flash');
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      void showNameEl.offsetWidth;
      showNameEl.classList.add('anim-flip');
    });
  });
  const flipDuration = 1250 * 7 + 200;
  setTimeout(() => {
    if (showNameEl.classList.contains('anim-flip')) {
      showNameEl.classList.remove('anim-flip');
      showNameEl.classList.add('anim-flash');
    }
  }, flipDuration);
}

launchBtn.addEventListener('click', launchShow);

</script>
</body>
</html>
